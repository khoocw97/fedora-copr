name: check-upstream

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: check-upstream
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      # fedora:44 镜像自带没有 git，若先 checkout 会只下载文件而没有 .git，
      # 后续 git pull/push 就会报 not a git repository。先装 git 再 checkout。
      - name: Install git for checkout
        run: dnf install -y git

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install tooling
        run: dnf install -y git rpm-build systemd-rpm-macros python3 curl

      - name: Bump specs to upstream HEAD
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch origin main
          git checkout -B main origin/main
          updated=false

          bump() {
            local repo=$1 spec=$2
            local sha cur isodate commitdate short
            sha=$(git ls-remote "https://github.com/${repo}" HEAD | awk '{print $1}')
            cur=$(awk '/^%global commit / {print $3}' "$spec")
            if [ "$sha" = "$cur" ]; then
              echo "${spec}: already at ${sha}, skip"
              return
            fi
            isodate=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/${repo}/commits/${sha}" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["commit"]["author"]["date"])')
            commitdate=$(date -u -d "$isodate" +%Y%m%d)
            short=${sha:0:7}
            echo "${spec}: ${cur:0:7} -> ${short} (${commitdate})"
            sed -i -E \
              -e "s|^%global commit .*|%global commit      ${sha}|" \
              -e "s|^%global commitdate .*|%global commitdate  ${commitdate}|" \
              "$spec"
            rpmspec -P "$spec" > /dev/null
            updated=true
          }

          bump noctalia-dev/umbriel umbriel.spec
          bump noctalia-dev/xdg-desktop-portal-umbriel xdg-desktop-portal-umbriel.spec

          if [ "$updated" = true ]; then
            git add *.spec
            git -c user.name='github-actions[bot]' \
                -c user.email='github-actions[bot]@users.noreply.github.com' \
                commit -m "chore: bump to latest upstream HEAD"
            git push origin main
          else
            echo "nothing to update"
          fi
