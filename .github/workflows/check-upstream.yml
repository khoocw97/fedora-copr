name: check-upstream

on:
  schedule:
    # 每天 00:00 Asia/Shanghai (UTC+8) = 前一天 16:00 UTC
    # GitHub Actions cron 只认 UTC，所以这里写 16:00
    - cron: '0 16 * * *'
  workflow_dispatch:

concurrency:
  group: check-upstream
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    container: fedora:44
    timeout-minutes: 10
    steps:

      - name: Install git for checkout
        run: dnf install -y git

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install tooling
        run: dnf install -y rpm-build systemd-rpm-macros python3 curl

      - name: Bump specs to upstream HEAD
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch origin main
          git checkout -B main origin/main
          updated=0

          bump() {
            local repo=$1 spec=$2
            local sha cur isodate commitdate short

            sha=$(timeout 30 git ls-remote "https://github.com/${repo}" HEAD 2>/dev/null \
                  | awk '{print $1}' || true)
            if [ -z "$sha" ]; then
              echo "${spec}: failed to resolve upstream HEAD, skip" >&2
              return
            fi

            cur=$(awk '/^%global commit / {print $3}' "$spec")
            if [ "$sha" = "$cur" ]; then
              echo "${spec}: already at ${sha}, skip"
              return
            fi

            if ! isodate=$(curl -fsSL --retry 3 --retry-connrefused \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/${repo}/commits/${sha}" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["commit"]["author"]["date"])'); then
              echo "${spec}: failed to fetch commit date, skip" >&2
              return
            fi
            commitdate=$(date -u -d "$isodate" +%Y%m%d)
            short=${sha:0:7}
            echo "${spec}: ${cur:0:7} -> ${short} (${commitdate})"

            sed -i -E \
              -e "s|^(%global commit)[[:space:]]+.*|\1      ${sha}|" \
              -e "s|^(%global commitdate)[[:space:]]+.*|\1  ${commitdate}|" \
              "$spec"

            rpmspec -P "$spec" > /dev/null
            updated=1
          }

          bump noctalia-dev/umbriel umbriel.spec
          bump noctalia-dev/xdg-desktop-portal-umbriel xdg-desktop-portal-umbriel.spec
          bump mroboff/vm-curator vm-curator.spec

          if [ "$updated" -eq 1 ]; then
            git add *.spec
            git -c user.name='github-actions[bot]' \
                -c user.email='github-actions[bot]@users.noreply.github.com' \
                commit -m "chore: bump to latest upstream HEAD"
            git push origin main
          else
            echo "nothing to update"
          fi
